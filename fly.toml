# One Fly app for apps/api: HTTP routes, AgentMail webhook, scheduler loop, Telegram bot.
app = "lowball-henri"
primary_region = "sjc"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  PORT = "8080"
  TZ = "America/Los_Angeles"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  memory = "1gb"
  cpus = 1
